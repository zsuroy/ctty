name: Release with GoReleaser

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  # Required for Homebrew tap updates
  issues: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for changelog generation
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Android NDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: "ndk;27.1.12297006"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Add NDK toolchain to PATH
        run: echo "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token for updating Homebrew tap (create this secret in your repo settings)
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
